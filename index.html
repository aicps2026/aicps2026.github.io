<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Under Construction</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 0;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    footer {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon">🚧</div>
    <h1>Site Under Construction</h1>
    <p>
      We’re working hard to bring you something amazing.
      Please check back soon.
    </p>

    <footer>
      &copy; 2026 LABTEC-AI. All rights reserved.
    </footer>
  </main>
</body>
</html>
